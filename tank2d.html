var mapSource='classic';        // 'classic' | 'custom'

function lsGet(k){try{return localStorage.getItem(k);}catch(e){return null;}}
function lsSet(k,v){try{localStorage.setItem(k,v);}catch(e){}}
function safeParse(s){try{return JSON.parse(s);}catch(e){return null;}}
function normalizePack(obj){
  if(!obj)return null;
  var name='自定义',stages=null;
  if(Array.isArray(obj))stages=obj; else {name=obj.name||name;stages=obj.stages;}
  if(!Array.isArray(stages)||!stages.length)return null;
  var VALID='.bswti',fixed=[];
  function norm(v){return VALID.indexOf(v)>=0?v:'.';}
  for(var i=0;i<stages.length;i++){
    var st=stages[i]||{},mm=st.map;
    if(typeof mm==='string')mm=mm.split('\n');
    if(!Array.isArray(mm))return null;
    var g=[];
    for(var y=0;y<26;y++){var row=mm[y]||'',s='';for(var x=0;x<26;x++)s+=norm(row.charAt(x));g.push(s);}
    var b=st.bots;if(!Array.isArray(b)||b.length<4)b=[18,2,0,0];
    fixed.push({map:g,bots:[b[0]|0,b[1]|0,b[2]|0,b[3]|0]});
  }
  return {name:name,stages:fixed};
}
function activeStages(){return (mapSource==='custom'&&customPack)?customPack.stages:LEVELS;}
function loadCustomFromLS(){
  customPack=normalizePack(safeParse(lsGet(LS_CUSTOM)));
  if(lsGet(LS_SOURCE)==='custom'&&customPack)mapSource='custom';
}
function setMapSource(src){
  mapSource=(src==='custom'&&customPack)?'custom':'classic';
  lsSet(LS_SOURCE,mapSource);
}
function importMapFile(file){
  if(!file)return;
  var rd=new FileReader();
  rd.onload=function(){
    var p=normalizePack(safeParse(rd.result));
    if(!p){alert('地图文件无法识别。\n需要 JSON：{ name, stages:[ { map:[26 行], bots:[4] } ] }');return;}
    customPack=p; setMapSource('custom');
    lsSet(LS_CUSTOM,JSON.stringify({name:p.name,stages:p.stages}));
    initAudio();sfx('bonusGet');
  };
  rd.readAsText(file);
}

function loadLevel(idx){

function allSolidTanks(skip){
  var a=alivePlayers().filter(function(p){return p!==skip;}),i;
  for(i=0;i<enemies.length;i++){
    var e=enemies[i];
    if(e!==skip&&e.spawning<=0)a.push(e);
  }
  return a;
}
function tankBlocked(t,x,y){
  if(x<0||y<0||x+TS>FIELD||y+TS>FIELD)return true;
  var x0=x>>4,y0=y>>4,x1=(x+TS-1)>>4,y1=(y+TS-1)>>4,tx,ty,m;
  for(ty=y0;ty<=y1;ty++)for(tx=x0;tx<=x1;tx++){
    m=map[ty][tx];
    if(m===BRICK||m===STEEL||m===WATER)return true;
  }
  if(rectsHit(x,y,TS,TS,BASE.x,BASE.y,BASE.w,BASE.h))return true;
  var others=allSolidTanks(t);
  for(var i=0;i<others.length;i++){
    var o=others[i];
    if(rectsHit(x,y,TS,TS,o.x,o.y,TS,TS))return true;
  }
  return false;
}
function tryMove(t,dist){
  var moved=false;
  for(var i=0;i<dist;i++){
    var nx=t.x+DX[t.dir], ny=t.y+DY[t.dir];
    if(tankBlocked(t,nx,ny))break;
    t.x=nx; t.y=ny; moved=true;
  }
  if(moved)t.frame++;
  return moved;
}
// 转向时把垂直轴吸附到最近的可通行 16px 车道（整格对齐）。碰撞按 16px 整块判定、
// 坦克 32px，只有车身对齐到 TILE 倍数才钻得进 2 格宽通道；吸附到 8px（半格）会让
// 车身横跨格线、压到墙角而卡住。这里学 Battle City 的容错：先试最近格线，被挡再试
// 另一侧邻格线，都被挡才保持原位——相当于"差一点就自动挪到合适位置再转向"。
function alignAxis(t,vertical){
  var c=vertical?t.x:t.y;
  var lo=Math.floor(c/TILE)*TILE, hi=Math.ceil(c/TILE)*TILE;
  if(lo===hi)return;                        // 已对齐到车道
  var cand=(c-lo<=hi-c)?[lo,hi]:[hi,lo];    // 离当前位置近的格线优先
  for(var i=0;i<2;i++){
    var v=cand[i];
    if(vertical){ if(!tankBlocked(t,v,t.y)){t.x=v;return;} }
    else        { if(!tankBlocked(t,t.x,v)){t.y=v;return;} }
  }
}
function setDir(t,d){
  if(d===t.dir)return;
  alignAxis(t, d===UP||d===DOWN);
  t.dir=d;
}
function dirToward(t,tx,ty){
  var dx=tx-t.x, dy=ty-t.y;
  if(Math.abs(dx)>Math.abs(dy))return dx>0?RIGHT:LEFT;
  return dy>0?DOWN:UP;
}

function maxBullets(t){

function fire(t){
  if(t.bulletsAlive>=maxBullets(t))return false;
  var cx=t.x+16, cy=t.y+16;
  var spd, power=1;
  if(t.side==='P'){
    spd=t.star>=1?6:4;
    if(t.star>=3)power=3;
  }else spd=t.bulletSpeed;
  var mx=cx+DX[t.dir]*16, my=cy+DY[t.dir]*16;
  bullets.push({x:mx,y:my,dir:t.dir,spd:spd,power:power,owner:t,
                fromP:(t.side==='P'),dead:false});
  t.bulletsAlive++;
  explosions.push({x:mx,y:my,t:0,life:5,kind:'muzzle'});
  sfx(t.side==='P'?'fire':'efire');
  return true;
}
function killBullet(b,explode){
  if(b.dead)return;
  b.dead=true;
  b.owner.bulletsAlive=Math.max(0,b.owner.bulletsAlive-1);
  if(explode)explosions.push({x:b.x,y:b.y,t:0,life:16,kind:'small'});
}
function destroyStrip(b){
  // 深度方向只削迎弹的 1 层子块（半格=8px）；宽度方向取坦克车身宽（2 tile），
  // 让缺口够车身通过。砖块按 2×2 子块逐步削，打一枪掉半格（经典「1/4 砖」）。
  var hitSteel=false, broke=false, lo,hi,dep,k,nb;
  function hit(sx,sy){
    if(sx<0||sy<0||sx>=N*2||sy>=N*2)return;
    var tx=sx>>1,ty=sy>>1,m=map[ty][tx];
    if(m===BRICK){
      var bit=subBit(sx&1,sy&1);
      if(brickMask[ty][tx]&bit){
        brickMask[ty][tx]&=~bit; broke=true;
        if(brickMask[ty][tx]===0)map[ty][tx]=EMPTY;
      }
    }else if(m===STEEL){
      if(b.power>=3){map[ty][tx]=EMPTY;brickMask[ty][tx]=0;broke=true;}
      else hitSteel=true;
    }
  }
  if(b.dir===UP||b.dir===DOWN){
    dep=(b.dir===UP?(b.y-4):(b.y+3))>>3;   // 迎弹子块行
    nb=Math.round(b.x/16); lo=nb-1; hi=nb; // 宽度=车身（2 tile）
    for(k=lo;k<=hi;k++){hit(k*2,dep);hit(k*2+1,dep);}
  }else{
    dep=(b.dir===LEFT?(b.x-4):(b.x+3))>>3; // 迎弹子块列
    nb=Math.round(b.y/16); lo=nb-1; hi=nb;
    for(k=lo;k<=hi;k++){hit(dep,k*2);hit(dep,k*2+1);}
  }
  sfx(broke?'brick':(hitSteel?'steel':'brick'));
}
function bulletStep(b){
  if(b.x<3||b.x>FIELD-3||b.y<3||b.y>FIELD-3){
    b.x=clamp(b.x,3,FIELD-3); b.y=clamp(b.y,3,FIELD-3);
    killBullet(b,true);
    if(b.fromP)sfx('steel');
    return;
  }
  var bx=b.x-4,by=b.y-4;
  // 子弹碰撞按 8px 子块判定：钢板整格挡；砖块只有迎面子块仍在才挡（半格缺口能穿）
  var sx0=clamp(bx>>3,0,N*2-1),sy0=clamp(by>>3,0,N*2-1);
  var sx1=clamp((bx+7)>>3,0,N*2-1),sy1=clamp((by+7)>>3,0,N*2-1);
  var solid=false,sx,sy,tx,ty,m;
  for(sy=sy0;sy<=sy1&&!solid;sy++)for(sx=sx0;sx<=sx1;sx++){
    tx=sx>>1;ty=sy>>1;m=map[ty][tx];
    if(m===STEEL){solid=true;break;}
    if(m===BRICK&&(brickMask[ty][tx]&subBit(sx&1,sy&1))){solid=true;break;}
  }
  if(solid){destroyStrip(b);killBullet(b,true);return;}
  if(rectsHit(bx,by,8,8,BASE.x,BASE.y,BASE.w,BASE.h)){
    killBullet(b,true);
    if(baseAlive)destroyBase();
    return;
  }
  var pi,p;
  if(b.fromP){
    for(var i=0;i<enemies.length;i++){
      var e=enemies[i];
      if(e.spawning>0)continue;
      if(rectsHit(bx,by,8,8,e.x+2,e.y+2,TS-4,TS-4)){
        hitEnemy(e,b.owner);
        killBullet(b,e.hp>0);
        return;
      }
    }
    // 误伤队友：短暂眩晕（经典规则）
    for(pi=0;pi<players.length;pi++){
      p=players[pi];
      if(p===b.owner||!p.alive||p.spawning>0)continue;
      if(rectsHit(bx,by,8,8,p.x+2,p.y+2,TS-4,TS-4)){
        killBullet(b,false);
        if(p.shield<=0){p.stun=180;sfx('steel');}
        return;
      }
    }
  }else{
    for(pi=0;pi<players.length;pi++){
      p=players[pi];
      if(!p.alive||p.spawning>0)continue;
      if(rectsHit(bx,by,8,8,p.x+2,p.y+2,TS-4,TS-4)){
        killBullet(b,p.shield<=0);
        if(p.shield<=0)killPlayer(p);
        return;
      }
    }
  }
  for(var j=0;j<bullets.length;j++){
    var o=bullets[j];
    if(o===b||o.dead||o.fromP===b.fromP)continue;
    if(Math.abs(o.x-b.x)<8&&Math.abs(o.y-b.y)<8){
      killBullet(b,false);killBullet(o,false);
      return;
    }
  }
}
function updateBullet(b){
  var steps=Math.ceil(b.spd/2), step=b.spd/steps;
  for(var i=0;i<steps&&!b.dead;i++){
    b.x+=DX[b.dir]*step; b.y+=DY[b.dir]*step;
    bulletStep(b);
  }
}

// ---------- 击杀 / 基地 ----------
function hitEnemy(e,byTank){
  if(e.bonus){e.bonus=false;dropPowerup();}
  e.hp--;
  if(e.hp<=0){
    explosions.push({x:e.x+16,y:e.y+16,t:0,life:32,kind:'big'});
    var sc=E_SCORE[e.type];
    if(byTank&&byTank.side==='P'){byTank.score+=sc;stageKills[byTank.idx][e.type]++;}
    floats.push({x:e.x+16,y:e.y+16,txt:String(sc),t:45});
    var i=enemies.indexOf(e);
    if(i>=0)enemies.splice(i,1);
    sfx('boom');
  }else{e.flash=8;sfx('clank');}
}
function allPlayersOut(){
  for(var i=0;i<players.length;i++)
    if(players[i].lives>0||players[i].alive)return false;
  return true;
}
function killPlayer(p){
  if(!p.alive)return;
  explosions.push({x:p.x+16,y:p.y+16,t:0,life:32,kind:'big'});
  p.alive=false;
  p.star=0;
  p.lives--;
  sfx('boom');
  if(p.lives>0)p.respawnTimer=70;
  else if(allPlayersOut())startGameOver();
}
function destroyBase(){
  baseAlive=false;
  explosions.push({x:BASE.x+16,y:BASE.y+16,t:0,life:32,kind:'big'});
  sfx('boom');
  startGameOver();
}
function startGameOver(){
  if(gameOverTimer<0){gameOverTimer=0;sfx('gameover');}
}

// ---------- 道具 ----------
function dropPowerup(){
  var kinds=['helmet','timer','shovel','star','grenade','tank'];
  var k=kinds[Math.floor(Math.random()*kinds.length)];
  var px,py,tries=0;
  do{
    px=randInt(0,24)*16; py=randInt(0,23)*16; tries++;
  }while(tries<50&&rectsHit(px,py,32,32,BASE.x-32,BASE.y-32,96,64));
  powerup={kind:k,x:px,y:py};
  sfx('bonusIn');
}
function applyPowerup(p,k,px,py){
  p.score+=500;
  floats.push({x:px+16,y:py+16,txt:'500',t:45});
  if(k==='helmet')p.shield=600;
  else if(k==='timer')freezeTimer=480;
  else if(k==='star')p.star=Math.min(3,p.star+1);
  else if(k==='tank')p.lives++;
  else if(k==='shovel'){shovelTimer=900;setRing(STEEL);}
  else if(k==='grenade'){
    for(var i=enemies.length-1;i>=0;i--){
      var e=enemies[i];
      if(e.spawning>0)continue;
      explosions.push({x:e.x+16,y:e.y+16,t:0,life:32,kind:'big'});
      enemies.splice(i,1);
    }
    sfx('boom');
  }
  sfx('bonusGet');
}

// ---------- 敌人 AI ----------
function areaClear(x,y){
  var tanks=allSolidTanks(null),i;
  for(i=0;i<tanks.length;i++)
    if(rectsHit(x,y,TS,TS,tanks[i].x,tanks[i].y,TS,TS))return false;
  for(i=0;i<enemies.length;i++)
    if(enemies[i].spawning>0&&rectsHit(x,y,TS,TS,enemies[i].x,enemies[i].y,TS,TS))return false;
  return true;
}
function areaClear2(t){
  var tanks=allSolidTanks(t),i;
  for(i=0;i<tanks.length;i++)
    if(rectsHit(t.x,t.y,TS,TS,tanks[i].x,tanks[i].y,TS,TS))return false;
  return true;
}
function updateSpawning(){
  if(enemyQueue.length===0)return;
  if(enemies.length>=maxAlive())return;
  if(spawnTimer>0){spawnTimer--;return;}
  for(var i=0;i<3;i++){
    var p=SPAWN_PTS[(spawnPointIdx+i)%3];
    if(areaClear(p.x,p.y)){
      var type=enemyQueue.shift();
      spawnedCount++;
      var e=makeEnemy(type,p.x,p.y);
      if(BONUS_AT.indexOf(spawnedCount)>=0)e.bonus=true;
      enemies.push(e);
      spawnPointIdx=(spawnPointIdx+i+1)%3;
      spawnTimer=spawnInterval();
      return;
    }
  }
  spawnTimer=25;
}
function pickDir(e){
  var r=Math.random(),d;
  var ap=alivePlayers();
  var tgt=ap.length?ap[Math.floor(Math.random()*ap.length)]:null;
  if(r<0.35)d=DOWN;
  else if(r<0.55&&tgt)d=dirToward(e,tgt.x,tgt.y);
  else if(r<0.75)d=dirToward(e,BASE.x,BASE.y);
  else d=Math.floor(Math.random()*4);
  setDir(e,d);
  e.think=randInt(25,100);
}
function updateEnemy(e){
  if(e.spawning>0){
    e.spawning--;
    if(e.spawning===0&&!areaClear2(e))e.spawning=8;
    return;
  }
  if(freezeTimer>0)return;
  if(e.flash>0)e.flash--;
  var moved=tryMove(e,e.speed);
  e.think--;
  if(!moved||e.think<=0)pickDir(e);
  if(Math.random()<e.fireProb*fireMul())fire(e);
}

// ---------- 玩家更新 ----------
function onIce(t){
  var tx=clamp((t.x+16)>>4,0,N-1), ty=clamp((t.y+16)>>4,0,N-1);
  return map[ty][tx]===ICE;
}
function updatePlayer(p,inp){
  if(!p.alive){
    if(p.lives>0&&gameOverTimer<0){
      p.respawnTimer--;
      if(p.respawnTimer<=0)respawnPlayer(p);
    }
    return;
  }
  if(p.spawning>0){
    p.spawning--;
    if(p.spawning===0&&!areaClear2(p))p.spawning=8;
    return;
  }
  if(p.shield>0)p.shield--;
  if(p.stun>0){p.stun--;return;}
  if(inp.cd>0)inp.cd--;
  var d=inp.stack.length?inp.stack[inp.stack.length-1]:-1;
  if(d>=0){
    setDir(p,d);
    tryMove(p,p.speed);
    p.slide=onIce(p)?14:0;
  }else if(p.slide>0&&onIce(p)){
    tryMove(p,1);
    p.slide--;
  }
  if(inp.fire&&inp.cd<=0){
    if(fire(p))inp.cd=10;
  }
}

// ---------- 关卡流程 ----------
function startStage(idx){
  stage=idx;
  stageKills=[[0,0,0,0],[0,0,0,0]];   // 新关重置本关击杀统计
  loadLevel(idx);
  enemyQueue=buildQueue(idx);
  enemies=[];bullets=[];explosions=[];floats=[];powerup=null;
  spawnedCount=0;spawnTimer=60;spawnPointIdx=0;
  freezeTimer=0;shovelTimer=0;baseAlive=true;
  gameOverTimer=-1;clearTimer=-1;
  inputs.forEach(function(inp){inp.stack.length=0;inp.fire=false;inp.cd=0;});
  players.forEach(function(p){
    p.bulletsAlive=0;
    if(p.lives>0)respawnPlayer(p);
    else p.alive=false;
  });
  state='intro';introTimer=140;paused=false;
  sfx('start');   // 每关开场号角（还原原版逐关播放）
}
function buildKeymap(){
  keymap={};
  function dirKeys(pi,u,d,l,r){
    keymap[u]={p:pi,t:'dir',d:UP};keymap[d]={p:pi,t:'dir',d:DOWN};
    keymap[l]={p:pi,t:'dir',d:LEFT};keymap[r]={p:pi,t:'dir',d:RIGHT};
  }
  dirKeys(0,'KeyW','KeyS','KeyA','KeyD');
  keymap.Space={p:0,t:'fire'};keymap.KeyJ={p:0,t:'fire'};
  if(twoPlayer){
    dirKeys(1,'ArrowUp','ArrowDown','ArrowLeft','ArrowRight');
    keymap.Numpad0={p:1,t:'fire'};keymap.Period={p:1,t:'fire'};keymap.Slash={p:1,t:'fire'};
  }else{
    dirKeys(0,'ArrowUp','ArrowDown','ArrowLeft','ArrowRight');
  }
}
function newGame(two){
  twoPlayer=!!two;
  STAGES=activeStages().length;   // 按所选地图集确定关卡总数
  buildKeymap();
  players=[makePlayer(0)];
  if(twoPlayer)players.push(makePlayer(1));
  startStage(0);
}
function totalScore(){
  var s=0;for(var i=0;i<players.length;i++)s+=players[i].score;return s;
}
function updatePlay(){
  updateSpawning();
  for(var i=0;i<players.length;i++)updatePlayer(players[i],inputs[i]);
  for(i=0;i<enemies.length;i++)updateEnemy(enemies[i]);
  for(i=0;i<bullets.length;i++)if(!bullets[i].dead)updateBullet(bullets[i]);
  for(i=bullets.length-1;i>=0;i--)if(bullets[i].dead)bullets.splice(i,1);
  for(i=explosions.length-1;i>=0;i--){
    explosions[i].t++;
    if(explosions[i].t>explosions[i].life)explosions.splice(i,1);
  }
  for(i=floats.length-1;i>=0;i--){
    floats[i].t--;floats[i].y-=0.4;
    if(floats[i].t<=0)floats.splice(i,1);
  }
  if(freezeTimer>0)freezeTimer--;
  if(shovelTimer>0){
    shovelTimer--;
    if(shovelTimer===0)setRing(BRICK);
    else if(shovelTimer<128)setRing(((shovelTimer>>3)%2)?STEEL:BRICK); // 到期前闪烁警示
  }
  if(powerup){
    for(i=0;i<players.length;i++){
      var p=players[i];
      if(p.alive&&p.spawning<=0&&
         rectsHit(p.x,p.y,TS,TS,powerup.x,powerup.y,32,32)){
        var k=powerup.kind,ppx=powerup.x,ppy=powerup.y;
        powerup=null;applyPowerup(p,k,ppx,ppy);
        break;
      }
    }
  }
  if(gameOverTimer>=0){
    gameOverTimer++;
    if(gameOverTimer>170){state='over';if(totalScore()>hiscore)hiscore=totalScore();}
    return;
  }
  if(enemyQueue.length===0&&enemies.length===0){
    if(clearTimer<0)clearTimer=0;
    clearTimer++;
    if(clearTimer>160){
      if(totalScore()>hiscore)hiscore=totalScore();
      scoreLast=(stage+1>=STAGES);   // 记下是否最后一关，结算页结束后据此通关或进下一关
      state='score';scoreTimer=0;
    }
  }
}
function tick(){
  frame++;
  if(state==='intro'){
    introTimer--;
    if(introTimer<=0)state='play';
  }else if(state==='play'&&!paused){
    updatePlay();
  }else if(state==='score'){
    scoreTimer++;
    if(scoreTimer>300)advanceFromScore();   // 约 5 秒后自动推进（Enter 可提前）
  }
}
function advanceFromScore(){
  if(scoreLast){state='win';sfx('fanfare');}
  else startStage(stage+1);
}

// ---------- 音效（真实采样 + 经典引擎"突突"环境声）----------
// 采样来自 3D 版同一套 Battle City 音源，已 base64 内嵌（见文件末尾 SFX_DATA）；
// 事件音映射沿用 3D 版逻辑，不提供导入/切换/选项。内嵌解码，离线/双击均可发声。
var actx=null, master=null;
var sfxBuf={};   // name -> AudioBuffer
function b64ToBuf(b64){
  var bin=atob(b64),n=bin.length,u=new Uint8Array(n);
  for(var i=0;i<n;i++)u[i]=bin.charCodeAt(i);
  return u.buffer;
}
function initAudio(){
  if(actx)return;
  try{
    var AC=window.AudioContext||window.webkitAudioContext;
    if(!AC)return;
    actx=new AC();
    master=actx.createGain();
    master.gain.value=muted?0:0.9;
    master.connect(actx.destination);
    loadSamples();
  }catch(e){actx=null;}
}
function loadSamples(){
  if(!actx||typeof SFX_DATA==='undefined')return;
  Object.keys(SFX_DATA).forEach(function(name){
    try{actx.decodeAudioData(b64ToBuf(SFX_DATA[name]),
      function(b){sfxBuf[name]=b;},function(){});}catch(e){}
  });
}
function playBuf(name,vol){
  var b=sfxBuf[name];
  if(!b||!actx||muted)return;
  try{
    var s=actx.createBufferSource();s.buffer=b;
    var g=actx.createGain();g.gain.value=vol||1;
    s.connect(g);g.connect(master);s.start();
  }catch(e){}
}
// 一声方波（菜单光标/暂停——无对应采样，沿用经典芯片音）
function blip(f,dur,vol){
  if(!actx||muted)return;
  try{
    var t=actx.currentTime,o=actx.createOscillator(),g=actx.createGain();
    o.type='square';o.frequency.value=f;
    g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(0.001,t+dur);
    o.connect(g);g.connect(master);o.start(t);o.stop(t+dur+0.02);
  }catch(e){}
}
function sfx(name){
  if(!actx||muted)return;
  if(name==='pause'){blip(880,0.07,0.06);return;}
  playBuf(name);
}
// 经典引擎"突突"环境声：还原 FC Battle City——战斗中持续脉冲，移动时更急促、音更高
var eng={next:0};
function engPulse(f0,f1,t0,dur,vol){
  if(!actx)return;
  try{
    var o=actx.createOscillator(),g=actx.createGain();
    o.type='square';o.frequency.setValueAtTime(f0,t0);
    if(f1!==f0)o.frequency.exponentialRampToValueAtTime(Math.max(1,f1),t0+dur);
    g.gain.setValueAtTime(vol,t0);g.gain.exponentialRampToValueAtTime(0.001,t0+dur);
    o.connect(g);g.connect(master);o.start(t0);o.stop(t0+dur+0.03);
  }catch(e){}
}
function anyPlayerMoving(){
  if(state!=='play'||paused)return false;
  for(var i=0;i<players.length;i++)
    if(players[i].alive&&inputs[i].stack.length>0)return true;
  return false;
}
function engineTick(){
  if(!actx||muted||actx.state==='suspended')return;
  if(state!=='play'||paused){eng.next=0;return;}
  var t=actx.currentTime;
  if(eng.next<t)eng.next=t+0.05;
  var moving=anyPlayerMoving(), spb=moving?0.085:0.15;
  while(eng.next<t+0.25){
    var f=moving?92:60;
    engPulse(f,f*0.7,eng.next,moving?0.07:0.10,moving?0.05:0.035);
    eng.next+=spb;
  }
}

// ---------- 像素图 ----------
function mkCanvas(w,h){var c=document.createElement('canvas');c.width=w;c.height=h;return c;}
function px(g,x,y,w,h,col){g.fillStyle=col;g.fillRect(x,y,w,h);}
var tileSpr={};
function buildTiles(){
  var g,c,i,j;
  c=mkCanvas(16,16);g=c.getContext('2d');
  px(g,0,0,16,16,'#9c4a00');
  g.fillStyle='#621d00';
  g.fillRect(0,3,16,2);g.fillRect(0,11,16,2);
  g.fillRect(7,0,2,3);g.fillRect(3,5,2,6);g.fillRect(11,5,2,6);g.fillRect(7,13,2,3);
  g.fillStyle='#d77b4a';
  g.fillRect(0,0,16,1);g.fillRect(0,8,16,1);
  tileSpr[BRICK]=c;
  c=mkCanvas(16,16);g=c.getContext('2d');
  px(g,0,0,16,16,'#636363');
  px(g,1,1,14,14,'#ffffff');
  px(g,2,2,13,13,'#adadad');
  px(g,4,4,8,8,'#dbdbdb');
  tileSpr[STEEL]=c;
  tileSpr.water=[];
  for(i=0;i<2;i++){
    c=mkCanvas(16,16);g=c.getContext('2d');
    px(g,0,0,16,16,'#1c58f8');
    g.fillStyle='#63b6ff';
    for(j=0;j<4;j++){
      var off=(i===0)?0:4;
      g.fillRect((j*4+off)%16,j*4,3,2);
      g.fillRect((j*4+off+8)%16,j*4+2,2,1);
    }
    tileSpr.water.push(c);
  }
  c=mkCanvas(16,16);g=c.getContext('2d');
  px(g,0,0,16,16,'#0c5a0c');
  g.fillStyle='#00a800';
  for(i=0;i<14;i++)g.fillRect((i*7)%16,(i*5)%16,3,3);
  g.fillStyle='#7adb20';
  for(i=0;i<8;i++)g.fillRect((i*9+3)%16,(i*7+2)%16,2,2);
  tileSpr[TREES]=c;
  c=mkCanvas(16,16);g=c.getContext('2d');
  px(g,0,0,16,16,'#c8c8c8');
  g.fillStyle='#ffffff';
  g.fillRect(0,0,8,8);g.fillRect(8,8,8,8);
  g.fillStyle='#e8e8e8';
  g.fillRect(2,10,4,1);g.fillRect(10,3,4,1);

function paintPixels(g, rows, colors, x, y, size) {
  rows.forEach(function(row, dy) {
    for (var dx = 0; dx < row.length; dx++) {
      var color = colors[row[dx]];
      if (color) {
        g.fillStyle = color;
        g.fillRect(x + dx * size, y + dy * size, size, size);
      }
    }
  });
}

function tankSprite(model, palette, trackFrame) {
  var key = model.join('/') + ':' + palette.join('/') + ':' + trackFrame;
  if (tankCache.has(key)) return tankCache.get(key);
  var sprite = mkCanvas(32, 32), g = sprite.getContext('2d');
  var colors = { B: palette[0], L: palette[1], S: palette[2], D: palette[3] };
  // 履带齿交替明暗，停车后停在当前帧。
  hulls[model[0]].forEach(function(row, y) {
    colors.T = (y + trackFrame) % 2 ? palette[2] : palette[3];
    colors.R = (y + trackFrame) % 2 ? palette[0] : palette[1];
    paintPixels(g, [row], colors, 2, 2 + y * 2, 2);
  });
  paintPixels(g, turrets[model[1]], colors, 8, 0, 2);
  tankCache.set(key, sprite);
  return sprite;
}
function tankPalette(t){
  if(t.side==='P')return P_CFG[t.idx].pal;
  if(t.flash>0)return ['#ffffff','#ffffff','#cccccc','#999999'];
  if(t.bonus&&(frame>>3)%2===0)return ['#e04040','#ffa0a0','#902020','#601010'];
  if(t.type===1)return ['#58b8d8','#b0e8f8','#287898','#185868'];
  if(t.type===2)return ['#d05858','#f8b0a0','#883030','#581818'];
  if(t.type===3){
    var c=[['#b0b0b0','#e8e8e8','#707070','#484848'],
           ['#c0b060','#e8e0a0','#807030','#504818'],
           ['#80c080','#c0f0c0','#408040','#285028'],
           ['#60a8c0','#b0e0f0','#306880','#184858']];
    return c[clamp(t.hp-1,0,3)];
  }
  return ['#b0b0b0','#e8e8e8','#707070','#484848'];
}

function drawTiles(layer){
  for(var ty=0;ty<N;ty++)for(var tx=0;tx<N;tx++){
    var m=map[ty][tx];
    if(m===EMPTY)continue;
    if(layer===0&&m===TREES)continue;
    if(layer===1&&m!==TREES)continue;
    if(m===BRICK){   // 按 2×2 子块绘制残砖（被削掉的子块不画）
      var mask=brickMask?brickMask[ty][tx]:15,px=OX+tx*16,py=OY+ty*16,bi;
      for(bi=0;bi<4;bi++){
        if(!(mask&(1<<bi)))continue;
        var qc=(bi&1)*8,qr=(bi>>1)*8;
        ctx.drawImage(tileSpr[BRICK],qc,qr,8,8,px+qc,py+qr,8,8);
      }
      continue;
    }
    var spr;
    if(m===WATER)spr=tileSpr.water[(frame>>4)&1];
    else spr=tileSpr[m];
    ctx.drawImage(spr,OX+tx*16,OY+ty*16);
  }
}

function enterAction(){
  initAudio();
  if(actx&&actx.state==='suspended'){try{actx.resume();}catch(e){}}
  if(state==='menu'){
    if(menuSel===2)openMapImport();
    else newGame(menuSel===1);
  }
  else if(state==='score'){advanceFromScore();}
  else if(state==='play'||state==='intro'){
    if(paused)confirmPause();                 // 暂停中：执行选中项
    else setPaused(true);
  }
  else if(state==='over'||state==='win')state='menu';
}
function press(code,down){
  if(code==='Enter'){if(down)enterAction();return;}
  if(code==='KeyM'){if(down){muted=!muted;if(master)master.gain.value=muted?0:0.9;}return;}
  if(code==='KeyP'){if(down&&(state==='play'||state==='intro')){setPaused(!paused);}return;}
  // 暂停菜单导航（拦截移动键，避免恢复后乱跑）
  if(paused&&(state==='play'||state==='intro')){
    if(!down)return;
    if(code==='ArrowUp'||code==='KeyW'){pauseSel=(pauseSel+PAUSE_OPTS.length-1)%PAUSE_OPTS.length;sfx('pause');}
    else if(code==='ArrowDown'||code==='KeyS'){pauseSel=(pauseSel+1)%PAUSE_OPTS.length;sfx('pause');}
    return;
  }
  if(state==='menu'){
    if(!down)return;
    if(code==='ArrowUp'||code==='KeyW'){menuSel=(menuSel+MENU_N-1)%MENU_N;sfx('pause');}
    else if(code==='ArrowDown'||code==='KeyS'){menuSel=(menuSel+1)%MENU_N;sfx('pause');}
    else if(code==='KeyC'){setMapSource('classic');sfx('pause');}      // 切回经典原版
    else if(code==='KeyX'){setMapSource('custom');sfx('pause');}       // 用已导入的自定义
    return;
  }
  var m=keymap[code];
  if(!m)return;
  var inp=inputs[m.p];
  if(m.t==='dir'){
    var i=inp.stack.indexOf(m.d);
    if(down){if(i<0)inp.stack.push(m.d);}
    else if(i>=0)inp.stack.splice(i,1);
  }else{
    inp.fire=down;
  }
}

// ---------- 手柄（Gamepad API，自动接入，无配置）----------
// 按连接顺序自动分配：第 1 个手柄→ⅠP，第 2 个→ⅡP（单人模式两柄都给 ⅠP）。
// 方向：D-pad(12-15) 或左摇杆；开火：A/B/X/Y(0-3)；Start(9)=开始/暂停；Select(8)=静音。
// 不提供绑定/自定义界面，与 3D 版同一套按键习惯。
var GP_DEAD=0.5;
var gpSlot=[{},{}];                                  // 每槽位方向边沿状态
var gpSys={start:false,fire:false,select:false,nav:0};
function gpPadList(){
  var pads;try{pads=navigator.getGamepads&&navigator.getGamepads();}catch(e){return [];}
  if(!pads)return [];
  var list=[];for(var i=0;i<pads.length;i++)if(pads[i]&&pads[i].connected)list.push(pads[i]);
  return list;
}
function gpSetDir(pi,dir,on){
  var inp=inputs[pi];if(!inp)return;
  var i=inp.stack.indexOf(dir);
  if(on){if(i<0)inp.stack.push(dir);}else if(i>=0)inp.stack.splice(i,1);
}
function gpClearSlot(s){
  var st=gpSlot[s],pi=twoPlayer?s:0;
  [['u',UP],['d',DOWN],['l',LEFT],['r',RIGHT]].forEach(function(e){
    if(st[e[0]]){st[e[0]]=false;gpSetDir(pi,e[1],false);}
  });
  if(st.f){st.f=false;if(inputs[pi])inputs[pi].fire=false;}
}
function pollGamepads(){
  if(!navigator.getGamepads || document.hidden || !document.hasFocus())return;
  var list=gpPadList();
  // —— 系统键聚合：任意手柄都能触发 ——
  var anyUp=false,anyDown=false,anyFire=false,anyStart=false,anySelect=false;
  for(var j=0;j<list.length;j++){
    var gb=list[j].buttons||[],ga=list[j].axes||[];
    var sp=function(i){return gb[i]&&(gb[i].pressed||gb[i].value>0.5);};
    if(sp(12)||(ga[1]<-GP_DEAD))anyUp=true;
    if(sp(13)||(ga[1]>GP_DEAD))anyDown=true;
    if(sp(0)||sp(1)||sp(2)||sp(3))anyFire=true;
    if(sp(9))anyStart=true;
    if(sp(8))anySelect=true;
  }
  var startEdge=anyStart&&!gpSys.start;gpSys.start=anyStart;
  var fireEdge=anyFire&&!gpSys.fire;gpSys.fire=anyFire;
  if(anySelect&&!gpSys.select){muted=!muted;if(master)master.gain.value=muted?0:0.9;}
  gpSys.select=anySelect;
  // —— 非游戏态：菜单 / 结算 / 胜负 / 暂停 ——
  if(state==='menu'){
    var nav=anyUp?-1:(anyDown?1:0);
    if(nav!==0&&gpSys.nav===0){menuSel=(menuSel+nav+MENU_N)%MENU_N;sfx('pause');}
    gpSys.nav=nav;
    if(startEdge||fireEdge)enterAction();
    gpClearSlot(0);gpClearSlot(1);return;
  }
  if(state==='score'){gpSys.nav=0;if(startEdge||fireEdge)advanceFromScore();return;}
  if(state==='over'||state==='win'){gpSys.nav=0;if(startEdge||fireEdge)state='menu';return;}
  if(paused){
    var nv=anyUp?-1:(anyDown?1:0);
    if(nv!==0&&gpSys.nav===0){pauseSel=(pauseSel+nv+PAUSE_OPTS.length)%PAUSE_OPTS.length;sfx('pause');}
    gpSys.nav=nv;
    if(fireEdge)confirmPause();
    else if(startEdge){setPaused(false);}
    gpClearSlot(0);gpClearSlot(1);return;
  }
  gpSys.nav=0;
  if(startEdge){setPaused(true);gpClearSlot(0);gpClearSlot(1);return;}
  // —— 游戏内：逐槽位映射手柄到玩家 ——
  for(var s=0;s<2;s++){
    var gp=list[s];
    if(!gp){gpClearSlot(s);gpSlot[s].waitForNeutral=false;continue;}
    var pi=twoPlayer?s:0, st=gpSlot[s], btn=gp.buttons||[], ax=gp.axes||[];
    var pr=function(i){return btn[i]&&(btn[i].pressed||btn[i].value>0.5);};
    var up=pr(12)||((ax[1]||0)<-GP_DEAD), down=pr(13)||((ax[1]||0)>GP_DEAD);
    var left=pr(14)||((ax[0]||0)<-GP_DEAD), right=pr(15)||((ax[0]||0)>GP_DEAD);
    var fire=pr(0)||pr(1)||pr(2)||pr(3);
    if(st.waitForNeutral){
      gpClearSlot(s);
      if(!up&&!down&&!left&&!right&&!fire)st.waitForNeutral=false;
      continue;
    }
    if((up||down)&&(left||right)){ // 斜向只取主轴，避免方向栈抖动
      if(Math.abs(ax[1]||0)>=Math.abs(ax[0]||0))left=right=false;else up=down=false;
    }
    if(!!st.u!==up){st.u=up;gpSetDir(pi,UP,up);}
    if(!!st.d!==down){st.d=down;gpSetDir(pi,DOWN,down);}
    if(!!st.l!==left){st.l=left;gpSetDir(pi,LEFT,left);}
    if(!!st.r!==right){st.r=right;gpSetDir(pi,RIGHT,right);}
    if(!!st.f!==fire){st.f=fire;if(inputs[pi])inputs[pi].fire=fire;}
  }
}

  engineTick();
  render();
}
